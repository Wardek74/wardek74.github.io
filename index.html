<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wardek's Project Hub</title>
  <meta name="description" content="Wardek74 project hub — dashboards, tools and web experiences on GitHub Pages." />
  <meta name="author" content="Wardek74" />
  <meta name="theme-color" content="#0d0d0f" />
  <meta property="og:title" content="Wardek's Project Hub" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://wardek74.github.io/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<canvas id="particle-canvas" aria-hidden="true"></canvas>

<!-- ======= HEADER ======= -->
<header class="site-header" role="banner">
  <div class="header-inner">

    <!-- Brand -->
    <a href="/" class="brand" aria-label="Wardek's Project Hub — Home">
      <span class="brand-icon" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polygon points="4,4 36,4 36,36 4,36" fill="url(#bG)" stroke="url(#bS)" stroke-width="1.5"/>
          <polygon points="4,4 36,4 32,8 8,8" fill="url(#tG)" opacity="0.7"/>
          <polygon points="4,4 8,8 8,32 4,36" fill="url(#lG)" opacity="0.5"/>
          <text x="20" y="27" text-anchor="middle" font-family="VT323,monospace" font-size="18" fill="#e8f4f8">W</text>
          <defs>
            <linearGradient id="bG" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4db8ff"/><stop offset="100%" stop-color="#0070c0"/></linearGradient>
            <linearGradient id="tG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7fd4ff"/><stop offset="100%" stop-color="#4db8ff"/></linearGradient>
            <linearGradient id="lG" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#005fa3"/><stop offset="100%" stop-color="#003d6b"/></linearGradient>
            <linearGradient id="bS" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7fd4ff"/><stop offset="100%" stop-color="#0050a0"/></linearGradient>
          </defs>
        </svg>
      </span>
      <div class="brand-text">
        <span class="brand-name">Wardek's</span>
        <span class="brand-subtitle">Project Hub</span>
      </div>
    </a>

    <!-- Right controls: lang + theme (same placement as MineStats) -->
    <div class="header-controls">

      <!-- Language selector -->
      <div class="lang-selector" role="navigation" aria-label="Language selector">
        <button id="lang-btn" class="lang-btn" aria-haspopup="listbox" aria-expanded="false" aria-label="Select language">
          <span class="lang-flag">🇬🇧</span>
          <span class="lang-label">English</span>
          <svg class="lang-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>
        <div id="lang-dropdown" class="lang-dropdown" role="listbox" aria-label="Available languages">
          <!-- Built by JS -->
        </div>
      </div>

      <!-- Theme toggle -->
      <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Toggle theme">
        <span class="theme-icon">🌙</span>
      </button>

    </div>
  </div>
</header>

<!-- ======= HERO ======= -->
<section class="hero" aria-labelledby="hero-title">
  <p class="hero-eyebrow">// Wardek74 · GitHub Pages</p>
  <h1 id="hero-title" class="hero-title">My <span class="accent-diamond">Projects</span></h1>
  <p id="hero-desc" class="hero-description">
    A collection of dashboards, tools and web experiences.<br/>Click a card to explore.
  </p>
  <div class="search-wrapper" role="search">
    <label for="search-input" class="sr-only">Search a project</label>
    <span class="search-icon" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </span>
    <input type="search" id="search-input" class="search-input" placeholder="Search a project..." autocomplete="off" aria-label="Search projects" />
  </div>
  <p class="project-count" id="project-count" aria-live="polite">Loading…</p>
</section>

<!-- ======= GRID ======= -->
<main id="main-content" class="main-content" role="main">
  <div id="projects-grid" class="projects-grid" aria-label="Projects grid" role="list"></div>
  <div id="empty-state" class="empty-state" hidden aria-live="polite">
    <div class="empty-icon" aria-hidden="true">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
        <rect x="6" y="6" width="36" height="36" rx="4" stroke="var(--border)" stroke-width="2" stroke-dasharray="4 4"/>
        <path d="M18 24h12M24 18v12" stroke="var(--text-muted)" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <p class="empty-title" id="empty-title-text">No project found</p>
    <p class="empty-sub" id="empty-sub-text">Try another search term or add a project via Admin.</p>
  </div>
</main>

<!-- ======= FOOTER ======= -->
<footer class="site-footer" role="contentinfo">
  <div class="footer-inner">
    <div class="footer-left">
      <a href="https://github.com/wardek74" target="_blank" rel="noopener noreferrer"
        class="footer-github-link" id="footer-github-link" aria-label="Wardek74 GitHub profile (new tab)">
        <svg class="github-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
        </svg>
        <span>wardek74</span>
      </a>
    </div>
    <div class="footer-center">
      <span class="footer-copy" id="footer-copy-text">&copy; <span id="footer-year"></span> Wardek74 — All rights reserved.</span>
    </div>
    <div class="footer-right">
      <button id="admin-btn" class="admin-btn" aria-label="Admin panel" title="Admin">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
        Admin
      </button>
    </div>
  </div>
</footer>

<!-- ======= OVERLAY ======= -->
<div id="admin-overlay" class="admin-overlay" aria-hidden="true"></div>

<!-- ======= ADMIN PANEL ======= -->
<aside id="admin-panel" class="admin-panel" role="dialog" aria-modal="true" aria-labelledby="admin-panel-title" aria-hidden="true" hidden>
  <div class="admin-panel-header">
    <h2 id="admin-panel-title" class="admin-panel-title">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
      </svg>
      <span id="admin-panel-title-text">Administration</span>
    </h2>
    <button id="admin-close-btn" class="admin-close-btn" aria-label="Close panel">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <div class="admin-panel-body">
    <section class="admin-section">
      <p id="admin-instructions"></p>
      <a id="admin-edit-link" class="btn btn-primary" href="https://github.com/Wardek74/wardek74.github.io/edit/main/projects.json" target="_blank" rel="noopener noreferrer"></a>
      <p id="legacy-projects-note" hidden></p>
      <button type="button" id="export-local-projects" class="btn btn-ghost" hidden></button>
    </section>
  </div>
</aside>

<script src="i18n.js"></script>
<script src="script.js"></script>
</body>
</html>
